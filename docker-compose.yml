services:
  # --- Service 1: PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: taxsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxsmart_user
      POSTGRES_PASSWORD: taxsmart_password
      POSTGRES_DB: taxsmart_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taxsmart_user -d taxsmart_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Service 2: Redis In-Memory Cache & Queue ---
  redis:
    image: redis:7-alpine
    container_name: taxsmart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

# --- Persistent Storage Volumes ---
volumes:
  postgres_data:
  redis_data:
